[package]
name = "panorama-paper"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
raw-window-handle = "0.6.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "system"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wgpu = "30.0.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
